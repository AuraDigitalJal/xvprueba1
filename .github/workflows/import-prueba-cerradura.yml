name: Publicar recursos de prueba de cerradura
on:
  push:
    paths:
      - ".github/workflows/import-prueba-cerradura.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Obtener multimedia original de la demostración
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prueba-cerradura
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 150 "https://at.adobe.com/gfuyyjr97G6FQitw" -o prueba-cerradura/portada.jpg
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 150 "https://at.adobe.com/YuMksAtaNG12qHA2" -o prueba-cerradura/transicion.mp4
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 150 "https://at.adobe.com/aZpUFPRE4btuhjrl" -o prueba-cerradura/contenido.jpg
          file --mime-type prueba-cerradura/*
          file --mime-type prueba-cerradura/portada.jpg | grep -q 'image/jpeg'
          file --mime-type prueba-cerradura/contenido.jpg | grep -q 'image/jpeg'
          file --mime-type prueba-cerradura/transicion.mp4 | grep -q 'video/mp4'
          test "$(wc -c < prueba-cerradura/transicion.mp4)" -gt 100000
      - name: Guardar recursos en GitHub
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prueba-cerradura/portada.jpg prueba-cerradura/contenido.jpg prueba-cerradura/transicion.mp4
          git diff --cached --quiet || { git commit -m "Publicar imágenes y video de prueba cerradura"; git push; }
