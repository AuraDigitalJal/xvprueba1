<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7e4e0">
<meta property="og:title" content="La puerta de un mundo mágico · Prueba">
<meta property="og:description" content="Toca la cerradura y descubre la magia.">
<meta property="og:image" content="portada.jpg">
<title>La puerta mágica | Prueba</title>
<link rel="preload" as="image" href="portada.jpg"><link rel="preload" as="image" href="contenido.jpg">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#e9d6db}body{font-family:Georgia,"Times New Roman",serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body:before{content:"";position:fixed;inset:-8%;background:url(portada.jpg) center/cover;filter:blur(36px);opacity:.65}
#app{isolation:isolate;position:relative;width:100%;max-width:540px;height:100vh;height:100dvh;margin:auto;overflow:hidden;background:#e9d6db;box-shadow:0 5px 45px #4433}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none}
#cover{opacity:1;transition:opacity .5s}#movie{opacity:0;transition:opacity .5s;background:#48303e}#scene{opacity:0;transition:opacity .8s}
.playing #cover{opacity:0}.playing #movie{opacity:1}
.finished #cover,.finished #movie{opacity:0}.finished #scene{opacity:1}
#open{position:absolute;inset:0;border:0;background:transparent;color:#fff;width:100%;height:100%;cursor:pointer;touch-action:manipulation;z-index:3}
#open:focus-visible{outline:3px solid #e9cd8d;outline-offset:-7px}
#open[disabled]{opacity:0;visibility:hidden;pointer-events:none}
.hint{position:absolute;bottom:max(4.8%,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #fff8;border-radius:40px;padding:11px 25px 13px;background:linear-gradient(135deg,#915e7acc,#b1819fc4);box-shadow:0 4px 18px #5c3a4850,inset 0 1px #fff6;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);text-shadow:0 1px 6px #583e52;display:flex;flex-direction:column;align-items:center;gap:5px;white-space:nowrap}
.hint span{font-size:20px;line-height:1;color:#ffe3aa}.hint b{font-size:12px;letter-spacing:.16em;font-weight:400;text-transform:uppercase}.hint small{font:11px system-ui, sans-serif;letter-spacing:.04em}
#repeat{position:absolute;z-index:4;top:max(18px,env(safe-area-inset-top));right:16px;width:43px;height:43px;border-radius:50%;border:1px solid #fffa;color:white;background:#6142549c;backdrop-filter:blur(8px);font:25px Georgia;opacity:0;pointer-events:none;transition:opacity .4s;cursor:pointer}
.finished #repeat{opacity:1;pointer-events:auto}
#loading{position:absolute;bottom:15%;left:0;width:100%;text-align:center;color:#fff;font:12px system-ui;text-shadow:0 1px 8px #4c3940;opacity:0;pointer-events:none}.loading #loading{opacity:1}
@media(prefers-reduced-motion:reduce){#cover,#movie,#scene{transition-duration:.15s}}
</style></head><body>
<main id="app">
<img id="cover" class="layer" src="portada.jpg" alt="Cerradura dorada entre flores pastel">
<video id="movie" class="layer" preload="auto" playsinline webkit-playsinline disablepictureinpicture><source src="transicion.mp4" type="video/mp4"></video>
<img id="scene" class="layer" src="contenido.jpg" alt="Jardín encantado de cuento de hadas">
<button id="open" aria-label="Toca la cerradura para entrar"><div class="hint"><span aria-hidden="true">✧</span><b>Toca para entrar</b><small>Descubre la magia</small></div></button>
<span id="loading" aria-live="polite">Abriendo la puerta mágica…</span>
<button id="repeat" title="Repetir" aria-label="Volver a ver la animación">↺</button>
</main>
<script>
(()=>{const root=document.querySelector("#app"),v=document.querySelector("#movie"),go=document.querySelector("#open"),again=document.querySelector("#repeat");
let started=false;
function finish(){root.classList.remove("loading");root.classList.add("finished");v.pause()}
function start(){if(started)return;started=true;root.classList.remove("finished","playing");root.classList.add("loading");go.disabled=true;v.currentTime=0;v.muted=false;
const p=v.play();if(p&&p.then)p.then(()=>{root.classList.remove("loading");root.classList.add("playing");started=false}).catch(()=>{go.disabled=false;root.classList.remove("loading");started=false});else{root.classList.remove("loading");root.classList.add("playing");started=false}}
go.addEventListener("click",start);again.addEventListener("click",()=>{v.pause();v.currentTime=0;root.classList.remove("finished","playing","loading");go.disabled=false});
v.addEventListener("ended",finish);v.addEventListener("timeupdate",()=>{if(Number.isFinite(v.duration)&&v.duration-v.currentTime<.07)finish()});
v.addEventListener("error",()=>{if(root.classList.contains("playing"))finish()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&root.classList.contains("playing"))v.pause();else if(!document.hidden&&root.classList.contains("playing"))v.play().catch(finish)});
})();
</script></body></html>
